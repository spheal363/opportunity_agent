# ローカル開発用。Frontend / Backend をまとめて起動する。
#
#   docker compose up
#
# 変更する場合は相方へ共有すること（共通ファイル）。
services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - '5173:5173'
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
